name: Palomar full preflight
run-name: "Palomar full preflight ${{ inputs.request_id }}"

"on":
  workflow_dispatch:
    inputs:
      request_id:
        description: "Twelve lowercase alphanumeric characters"
        required: true
        type: string
      authorization_relationship:
        description: "The submitter's actual relationship to the formalization"
        required: true
        type: choice
        options:
          - "I am a responsible author or maintainer"
          - "I have approval from a responsible author or maintainer"

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: "14aa8d6b3c2f14a8540605e37144560b9a00e7e7"
      request_id: ${{ inputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"comparator.json","authorization_relationship":"${{ inputs.authorization_relationship }}"}
