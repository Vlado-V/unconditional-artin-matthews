name = "artinMatthews"
version = "0.1.0"
defaultTargets = ["Solution"]
moreLeanArgs = ["-j1"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "8accc04827c389e678c3ef83e623b402e7480394"

[[lean_lib]]
name = "Architect"
globs = ["Architect", "Architect.+"]

[[lean_lib]]
name = "ArtinMatthews"
globs = ["ArtinMatthews.+"]

[[lean_lib]]
name = "BridgeWeil"
globs = ["BridgeWeil"]

[[lean_lib]]
name = "ClassFieldTheory"
globs = ["ClassFieldTheory.+"]

[[lean_lib]]
name = "GaloisCohomology"
globs = ["GaloisCohomology.+"]

[[lean_lib]]
name = "OAI"
globs = ["OAI.+"]

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
globs = ["PrimeNumberTheoremAnd.+"]

[[lean_lib]]
name = "ProCGroups"
globs = ["ProCGroups.+"]

[[lean_lib]]
name = "RellichKondrachov"
globs = ["RellichKondrachov.+"]

[[lean_lib]]
name = "ValuedFieldTheory"
globs = ["ValuedFieldTheory.+"]

[[lean_lib]]
name = "rml"
globs = ["rml.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
