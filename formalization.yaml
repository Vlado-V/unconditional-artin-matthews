version: "v0.4"

project:
  name: "An Unconditional Artin–Matthews Theorem for Simultaneous Primitive Roots"
  description: >-
    For a nonempty finite set of integers excluding 0, 1, and −1, consider the
    primes for which every integer in the set is a primitive root. When neither
    Matthews obstruction occurs, the simultaneous primitive primes have a
    lower bound of order x/log x in every sufficiently large real dyadic
    interval (x, 2x] and positive lower relative density among the primes.
    When either obstruction occurs, the simultaneous primitive primes form a
    finite set. This is Theorem 1.1 of the accompanying paper.
  authors: ["Vlado Vojdanovski"]
  responsible_maintainers: ["Vlado Vojdanovski"]
  license: "Apache-2.0"

